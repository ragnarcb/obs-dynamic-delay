<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Delay</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #272930; --line: #3a3d46; --text: #e8e9ed; --muted: #9a9dab;
    --live: #3ecf6e; --delay: #f0a93b; --busy: #5aa7ff; --bad: #ff5d5d; --input: #1b1c21;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { padding: 8px; display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
  #modules, #banners { display: grid; gap: 8px; }
  #banners:empty { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .card > h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pill { font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .pill.live { background: rgba(62,207,110,.18); color: var(--live); }
  .pill.delayed { background: rgba(240,169,59,.18); color: var(--delay); }
  .pill.busy { background: rgba(90,167,255,.18); color: var(--busy); }
  .pill.off { background: #33353d; color: var(--muted); }
  .pill.bad { background: rgba(255,93,93,.2); color: var(--bad); }
  .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
  .muted { color: var(--muted); font-size: 12px; }
  p.muted { margin: 8px 0 0; }
  button { font: inherit; color: var(--text); background: #353842; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: #3f434e; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--busy); color: #06121f; border-color: transparent; font-weight: 700; }
  button.warn { background: var(--delay); color: #1b1300; border-color: transparent; font-weight: 700; }
  button.danger { background: var(--bad); color: #210404; border-color: transparent; font-weight: 700; }
  button.wide { width: 100%; padding: 11px; font-size: 15px; font-weight: 700; }
  button.small { padding: 3px 7px; font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
  .row button { padding: 7px 0; }
  .line { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .line > .grow { flex: 1; }
  .dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok::before { background: var(--live); } .dot.warn::before { background: var(--delay); } .dot.bad::before { background: var(--bad); }
  .dots { display: grid; gap: 3px; }
  .err { color: var(--bad); font-size: 12px; word-break: break-word; }
  .note { color: var(--busy); font-size: 12px; word-break: break-word; }
  .box { border: 1px solid var(--delay); background: rgba(240,169,59,.08); border-radius: 8px; padding: 10px; }
  .box.bad { border-color: var(--bad); background: rgba(255,93,93,.12); }
  .hidden { display: none !important; }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }
  label { display: grid; gap: 3px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--text); }
  input[type=text], input[type=password], input[type=number], select {
    font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  input[type=number] { width: 72px; }
  .actions { display: grid; gap: 6px; margin-top: 10px; }
  a { color: var(--muted); font-size: 12px; cursor: pointer; }
  .list > div { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
  .list > div:first-child { border-top: 0; padding-top: 0; }
  .out { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line); align-items: center; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-bottom: 4px; }
  .mods > div { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); }
  .mods > div:first-child { border-top: 0; }
  .mods > div > span { flex: 1; }
  .qr { background: #fff; padding: 8px; border-radius: 8px; width: fit-content; margin: 8px auto; }
  .qr svg { display: block; width: 180px; height: 180px; }
  code { background: var(--input); padding: 2px 5px; border-radius: 4px; font-size: 11px; word-break: break-all; display: block; }
  .credit { text-align: center; color: var(--muted); font-size: 11px; padding: 2px 0 6px; }
  .credit a { color: var(--busy); font-size: 11px; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  #toast { position: sticky; top: 4px; z-index: 5; }
</style>

    keySaved: "salva (digite para trocar)", keyPaste: "cole a chave aqui", growLabel: "Ao ligar ou aumentar o delay",
    growRewind: "Rebobinar (repete os últimos segundos, sem congelar)", growScene: "Mostrar uma cena do OBS enquanto o delay enche", growFreeze: "Congelar a imagem da live enquanto o delay enche",

};
const ALL_MODULES = ["delay", "censor", "replay", "clips", "panic", "health", "multistream", "rules", "chat", "phone", "streamdeck"];
let lang = /^pt/i.test(navigator.language) ? "pt" : "en";
const T = () => TEXT[lang] || TEXT.en;
const num = (x) => (lang === "pt" ? x.toFixed(1).replace(".", ",") : x.toFixed(1));
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- DOM helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "disabled") el[k] = !!v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== "") el.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return el;
}
const field = (label, input) => h("label", {}, label, input);
function numberInput(value, min, max, onchange) {
  return h("input", { type: "number", min, max, value, onchange: (e) => onchange(Math.max(min, Math.min(max, parseInt(e.target.value) || min))) });
}
// Scene pickers refresh their options when OBS reports its scenes.
let sceneSelects = [];
function fillSceneSelect(sel) {
  const value = sel.dataset.value || "";
  const names = [...new Set([...(value ? [value] : []), ...(status?.obs?.scenes || [])])];
  sel.replaceChildren();
  if (sel.dataset.none === "1" || !names.length) sel.append(h("option", { value: "", text: names.length ? T().none : T().noScenes }));
  for (const n of names) sel.append(h("option", { value: n, text: n }));
  sel.value = value;
}
function sceneSelect(value, onchange, allowNone) {
  const sel = h("select", { onchange: (e) => { sel.dataset.value = e.target.value; onchange(e.target.value); } });
  sel.dataset.value = value || "";
  sel.dataset.none = allowNone ? "1" : "0";
  fillSceneSelect(sel);
  sceneSelects.push(sel);
  return sel;
}

// ---------------------------------------------------------------- API
async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: Object.assign({ "x-dd-token": TOKEN }, opts.body ? { "Content-Type": "application/json" } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return r.json();
}
const cmd = (c) => api("/api/cmd/" + c, { method: "POST" }).then(refresh);
async function saveConfig(patch, msgEl) {
  const r = await api("/api/config", { body: patch });
  if (msgEl) msgEl.textContent = !r.ok ? r.error : r.next_stream ? T().savedNext : T().saved;
  else if (!r.ok) toast(r.error, "error");
  if (r.ok) await loadConfig();
  return r;
}

let cfg = null;
let status = null;

// ---------------------------------------------------------------- modules
// Each module: build() returns the card content; update(s) refreshes it with the live status.
const MODULES = {
  delay: {
    build() {
      this.pill = h("span", { class: "pill off" });
      this.phase = h("span", { class: "muted" });
      this.big = h("div", { class: "big", text: num(0) + " s" });
      this.sub = h("div", { class: "muted" });
      this.toggle = h("button", { class: "wide", onclick: () => cmd("toggle") });
      const row = h("div", { class: "row" },
        ...[10, 30, 60, 120].map((s) => h("button", { text: s, onclick: () => cmd("set/" + s) })),
        h("button", { text: "−5", onclick: () => cmd("add/-5") }), h("button", { text: "+5", onclick: () => cmd("add/5") }));
      return [h("div", { class: "top" }, this.pill, this.phase), this.big, this.sub, h("div", { style: "margin-top:8px" }, this.toggle), row];
    },
    update(s) {
      const e = s.engine;
      if (s.panic) { this.pill.className = "pill bad"; this.pill.textContent = T().panicPill; }
      else if (!e) { this.pill.className = "pill off"; this.pill.textContent = T().noLive; }
      else if (e.replaying) { this.pill.className = "pill busy"; this.pill.textContent = T().replay; }
      else {
        const busy = ["filling", "growing", "shrinking"].includes(e.phase);
        this.pill.className = "pill " + (busy ? "busy" : e.phase === "live" ? "live" : "delayed");
        this.pill.textContent = e.phase === "live" ? T().live : busy ? T().adjusting : T().delayed;
      }
      this.phase.textContent = e ? T().phases[e.phase] || e.phase : "";
      this.big.textContent = num(e ? e.current_ms / 1000 : 0) + " s";
      this.sub.textContent = `${T().delayForViewers} · ${T().setTo} ${s.delay_seconds} s`;
      this.toggle.className = "wide" + (s.enabled ? " warn" : "");
      this.toggle.textContent = s.enabled ? T().toggleOff : T().toggleOn(s.delay_seconds);
    },
  },
  censor: {
    build() {
      this.btn = h("button", { class: "wide danger", onclick: () => cmd("censor/" + cfg.censor_seconds) });
      return [this.btn, h("div", { class: "line" }, h("span", { class: "grow muted", text: T().seconds }),
        numberInput(cfg.censor_seconds, 1, 120, (v) => saveConfig({ censor_seconds: v }))), h("p", { class: "muted", text: T().censorHint })];
    },
    update(s) { this.btn.textContent = T().censorBtn(cfg.censor_seconds); this.btn.disabled = !s.engine || !s.enabled; },
  },
  replay: {
    build() {
      this.btn = h("button", { class: "wide primary", onclick: () => cmd("replay/" + cfg.replay_seconds) });
      return [this.btn, h("div", { class: "line" }, h("span", { class: "grow muted", text: T().seconds }),
        numberInput(cfg.replay_seconds, 3, 60, (v) => saveConfig({ replay_seconds: v }))), h("p", { class: "muted", text: T().replayHint })];
    },
    update(s) { this.btn.textContent = T().replayBtn(cfg.replay_seconds); this.btn.disabled = !s.engine || s.engine.replaying; },
  },
  clips: {
    build() {
      this.btn = h("button", { class: "wide primary", onclick: () => cmd("clip/" + cfg.clip_seconds) });

function copyText(text) {
  if (navigator.clipboard) return navigator.clipboard.writeText(text).catch(() => fallback());
  return Promise.resolve(fallback());
  function fallback() {
    const t = h("textarea", { style: "position:fixed;opacity:0" }, text);
    document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
}

function obsLine(s) {
  const o = s.obs || {};
  return h("span", { class: "dot " + (o.script ? (o.configured ? "ok" : "warn") : "bad"),

}

// ---------------------------------------------------------------- settings (always available)

  const card = $("settingsCard");
  const open = card.open;

    h("option", { value: "kick", text: "Kick" }), h("option", { value: "custom", text: T().other }));
  platform.value = platformOf(cfg.upstream_url);
  const url = h("input", { type: "text", placeholder: "rtmps://...", value: URLS[platform.value] ? "" : cfg.upstream_url });
  const urlRow = field(T().serverUrl, url);

  const grow = h("select", {}, h("option", { value: "rewind", text: T().growRewind }), h("option", { value: "scene", text: T().growScene }),

  const sceneRow = h("label", {}, T().sceneLabel, scene, h("span", { class: "muted", text: T().sceneTip }));
  const showRows = () => { urlRow.classList.toggle("hidden", !!URLS[platform.value]); sceneRow.classList.toggle("hidden", grow.value !== "scene"); };
  platform.onchange = showRows;
  grow.onchange = showRows;
  showRows();
  const start = h("input", { type: "checkbox", checked: cfg.start_enabled });
  const language = h("select", { onchange: (e) => saveConfig({ language: e.target.value }) },
    h("option", { value: "en", text: "English" }), h("option", { value: "pt", text: "Português (Brasil)" }));
  language.value = cfg.language;
  let armed = 0;
  const restore = h("a", { text: T().restoreObs, onclick: () => {
    if (Date.now() - armed < 5000) { armed = 0; obsAction("/api/obs/restore"); return; }
    armed = Date.now(); msg.textContent = T().confirmRestore;
  } });
  const save = h("button", { class: "primary", text: T().save, onclick: () => {
    const body = { upstream_url: URLS[platform.value] || url.value.trim(), grow_mode: grow.value, delay_scene: scene.value, start_enabled: start.checked };
    if (key.value.trim()) body.stream_key = key.value.trim();

    saveConfig(body, msg);

  card.replaceChildren(h("summary", { text: T().settings }), field(T().platform, platform), urlRow, field(T().streamKey, key),

function buildCustomize() {
  const card = $("customizeCard");
  const open = card.open;
  const shown = [...cfg.panel_modules];
  const order = [...shown, ...ALL_MODULES.filter((m) => !shown.includes(m))];
  const commit = () => saveConfig({ panel_modules: order.filter((m) => shown.includes(m)) });
  const list = h("div", { class: "mods" }, ...order.map((m, i) => h("div", {},
    h("input", { type: "checkbox", checked: shown.includes(m), onchange: (e) => {
      if (e.target.checked) shown.push(m); else shown.splice(shown.indexOf(m), 1);
      commit();
    } }),
    h("span", {}, h("b", { text: T().m[m] }), h("br"), h("span", { class: "muted", text: T().mDesc[m] })),
    h("button", { class: "small", title: T().up, text: "↑", disabled: i === 0, onclick: () => { [order[i - 1], order[i]] = [order[i], order[i - 1]]; commit(); } }),
    h("button", { class: "small", title: T().down, text: "↓", disabled: i === order.length - 1, onclick: () => { [order[i + 1], order[i]] = [order[i], order[i + 1]]; commit(); } }))));
  card.replaceChildren(h("summary", { text: T().customize }), h("p", { class: "muted", text: T().customizeHint }), list);

function obsAction(path) {
  api(path, { method: "POST" }).then((r) => toast(r.ok ? T().applying : r.error, r.ok ? "ok" : "error"));
}

// ---------------------------------------------------------------- page assembly
function buildAll() {
  sceneSelects = [];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T()[el.dataset.t]));
  const root = $("modules");
  root.replaceChildren();
  for (const id of cfg.panel_modules) {
    const m = MODULES[id];
    if (!m) continue;
    m.loaded = false;
    const title = id === "delay" ? null : h("h3", { text: T().m[id] });
    root.append(h("section", { class: "card", "data-module": id }, title, m.build()));
  }
  buildSettings();
  buildCustomize();
  if (status) render(status);
}

function toast(text, kind) {
  const el = $("toast");
  el.className = "box" + (kind === "error" || kind === "warn" ? " bad" : "");
  el.textContent = text;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.add("hidden"), 6000);
}

let lastEvent = null;
let lastMessage = null;
const downSince = {};
let scenesKey = null;
function render(s) {
  status = s;
  const key = (s.obs?.scenes || []).join("\n");
  if (key !== scenesKey) {
    scenesKey = key;
    sceneSelects = sceneSelects.filter((sel) => sel.isConnected);
    sceneSelects.forEach(fillSceneSelect);
  }
  for (const id of cfg.panel_modules) MODULES[id]?.update(s);
  const banners = [];
  const o = s.obs || {};
  if (o.script && !o.configured) banners.push(h("div", { class: "box" }, T().obsNotUsing, h("div", { class: "actions" }, h("button", { class: "primary", text: T().configureObs, onclick: () => obsAction("/api/obs/configure") }))));
  if (!cfg.stream_key_set) banners.push(h("div", { class: "box", text: T().keyMissing }));
  if (updateVersion) banners.push(h("div", { class: "box" }, T().update(updateVersion) + " ", h("a", { text: T().download, onclick: () => api("/api/open/releases", { method: "POST" }) })));
  for (const out of s.outputs || []) {
    if (s.engine && out.state === "reconnecting") {
      banners.push(h("div", { class: "box bad", text: T().alertDown(out.name) }));
      if (!downSince[out.name]) { downSince[out.name] = Date.now(); if (cfg.alert_sound) beep(); }
    } else delete downSince[out.name];
  }
  // without the health block, still show whether OBS is connected
  if (!cfg.panel_modules.includes("health")) banners.push(h("div", { class: "card dots" }, obsLine(s)));
  $("banners").replaceChildren(...banners);
  const ev = s.event ? s.event.id : 0;
  if (lastEvent !== null && ev !== lastEvent && s.event) toast(s.event.text, s.event.kind);
  lastEvent = ev;
  if (o.message && o.message !== lastMessage) {
    if (lastMessage !== null) { toast(o.message, "ok"); loadConfig(); }
    lastMessage = o.message;
  }
}

function beep() {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) { /* audio blocked */ }
}

async function loadConfig() {
  const c = await api("/api/config");
  if (c.ok === false) return;
  const rebuild = !cfg || JSON.stringify(c) !== JSON.stringify(cfg);
  cfg = c;
  if (TEXT[c.language]) lang = c.language;
  if (rebuild) buildAll();
}

// update check: once an hour, straight from GitHub
let updateVersion = null;
async function checkUpdate(current) {
  try {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem("dd-update") || "null"); } catch (e) {}
    if (!cached || Date.now() - cached.at > 3600e3) {
      const r = await fetch("https://api.github.com/repos/ragnarcb/obs-dynamic-delay/releases/latest");
      const j = await r.json();
      cached = { at: Date.now(), tag: (j.tag_name || "").replace(/^v/, "") };
      try { localStorage.setItem("dd-update", JSON.stringify(cached)); } catch (e) {}
    }
    const newer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
    updateVersion = cached.tag && newer(cached.tag, current) ? cached.tag : null;
  } catch (e) { /* offline */ }
}

let offline = false;
let checkedUpdate = false;
async function refresh() {
  try {
    const s = await api("/api/status");
    if (s.ok === false) throw new Error(s.error);
    if (offline || !cfg) { offline = false; await loadConfig(); }
    if (!checkedUpdate) { checkedUpdate = true; checkUpdate(s.version); }
    render(s);
  } catch (e) {
    offline = true;
    const pill = document.querySelector("[data-module=delay] .pill");
    if (pill) { pill.className = "pill off"; pill.textContent = T().relayOff; }
    if (!cfg) $("modules").replaceChildren(h("div", { class: "card" }, h("span", { class: "pill off", text: T().relayOff }), " ", h("span", { class: "muted", text: T().relayOffHint })));
  }
}

$("author").onclick = (ev) => {
  // inside an OBS dock a plain link would navigate the dock itself: ask the relay to open the browser
  ev.preventDefault();
  api("/api/open/author", { method: "POST" }).catch(() => window.open($("author").href, "_blank"));
};
document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T()[el.dataset.t]));
if (!TOKEN) {
  $("modules").replaceChildren(h("div", { class: "box bad", text: T().noToken }));
} else {
  refresh();
  setInterval(refresh, 700);
}
