<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Delay</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #272930; --line: #3a3d46; --text: #e8e9ed; --muted: #9a9dab;
    --live: #3ecf6e; --delay: #f0a93b; --busy: #5aa7ff; --bad: #ff5d5d; --input: #1b1c21;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { padding: 8px; display: grid; gap: 8px; max-width: 480px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pill { font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .pill.live { background: rgba(62,207,110,.18); color: var(--live); }
  .pill.delayed { background: rgba(240,169,59,.18); color: var(--delay); }
  .pill.busy { background: rgba(90,167,255,.18); color: var(--busy); }
  .pill.off { background: #33353d; color: var(--muted); }
  .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
  .muted { color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--text); background: #353842; border: 1px solid var(--line); border-radius: 6px; padding: 7px 0; cursor: pointer; }
  button:hover { background: #3f434e; }
  button.primary { background: var(--busy); color: #06121f; border-color: transparent; font-weight: 700; }
  button.on { background: var(--delay); color: #1b1300; border-color: transparent; }
  #toggle { width: 100%; padding: 11px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
  .dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok::before { background: var(--live); } .dot.warn::before { background: var(--delay); } .dot.bad::before { background: var(--bad); }
  .dots { display: grid; gap: 3px; }
  .err { color: var(--bad); font-size: 12px; word-break: break-word; }
  .note { color: var(--busy); font-size: 12px; word-break: break-word; }
  .warn-box { border-color: var(--delay); background: rgba(240,169,59,.08); }
  .hidden { display: none !important; }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }
  label { display: grid; gap: 3px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--text); }
  input[type=text], input[type=password], select {
    font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  .actions { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; }
  a { color: var(--muted); font-size: 12px; cursor: pointer; }
  .credit { text-align: center; color: var(--muted); font-size: 11px; padding: 2px 0 6px; }
  .credit a { color: var(--busy); font-size: 11px; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="top">
      <span id="pill" class="pill off"></span>
      <span class="muted" id="phase"></span>
    </div>
    <div class="big" id="current">0.0 s</div>
    <div class="muted"><span data-t="delayForViewers"></span> &middot; <span data-t="configured"></span> <b id="delay">30</b> s</div>
    <button id="toggle"></button>
    <div class="row">
      <button data-set="10">10</button><button data-set="30">30</button><button data-set="60">60</button>
      <button data-set="120">120</button><button data-add="-5">&minus;5</button><button data-add="5">+5</button>
    </div>
  </section>

  <section class="card warn-box hidden" id="obsBox">
    <div data-t="obsNotUsing"></div>
    <div class="actions"><button class="primary" id="configureObs" data-t="configureObs"></button></div>
  </section>

  <section class="card warn-box hidden" id="keyBox" data-t="keyMissing"></section>

  <section class="card dots">
    <span class="dot" id="obs">OBS</span>
    <span class="dot" id="up"></span>
    <span class="err" id="err"></span>
    <span class="note" id="msg"></span>
  </section>

  <details class="card" id="cfgBox">
    <summary data-t="settings"></summary>
    <label><span data-t="platform"></span>
      <select id="platform">
        <option value="twitch">Twitch</option>
        <option value="youtube">YouTube</option>
        <option value="kick">Kick</option>
        <option value="custom" data-t="other"></option>
      </select>
    </label>
    <label id="urlRow"><span data-t="serverUrl"></span>
      <input type="text" id="url" placeholder="rtmps://...">
    </label>
    <label><span data-t="streamKey"></span>
      <input type="password" id="key" autocomplete="off">
    </label>
    <label><span data-t="growLabel"></span>
      <select id="growMode">
        <option value="rewind" data-t="growRewind"></option>
        <option value="scene" data-t="growScene"></option>
        <option value="freeze" data-t="growFreeze"></option>
      </select>
    </label>
    <label id="sceneRow"><span data-t="sceneLabel"></span>
      <select id="scene"></select>
      <span class="muted" data-t="sceneTip"></span>
    </label>
    <label class="check"><input type="checkbox" id="startEnabled"> <span data-t="startEnabled"></span></label>
    <label><span data-t="language"></span>
      <select id="language">
        <option value="en">English</option>
        <option value="pt">Português (Brasil)</option>
      </select>
    </label>
    <div class="actions">
      <button class="primary" id="save" data-t="save"></button>
      <span class="note" id="saveMsg"></span>
      <a id="restoreObs" data-t="restoreObs"></a>
    </div>
  </details>

  <footer class="credit"><span data-t="developedBy"></span> <a id="author" href="https://github.com/ragnarcb" target="_blank" rel="noopener">ragnarcb</a></footer>
</main>
<script>
  const API = window.DD_API || "";
  const URLS = { twitch: "rtmp://live.twitch.tv/app", youtube: "rtmp://a.rtmp.youtube.com/live2" };
  const TEXT = {
    en: {
      delayForViewers: "delay for viewers", configured: "set to", obsNotUsing: "OBS is not streaming through the dynamic delay yet.",
      configureObs: "Configure OBS automatically", keyMissing: "The stream key is missing. Fill it in under Settings below.",
      settings: "Settings", platform: "Platform", other: "Other", serverUrl: "Server URL (copy it from the platform dashboard)",
      streamKey: "Stream key", growLabel: "When the delay is switched on or increased",
      growRewind: "Rewind (replays the last seconds, no freeze)", growScene: "Show an OBS scene while the delay builds up",
      growFreeze: "Freeze the live picture while the delay builds up", sceneLabel: "Scene shown while the delay builds up",
      sceneTip: "Tip: make a scene with just an image or text, like \"Applying delay...\". It is shown still and muted.",
      startEnabled: "Start every stream with the delay on", language: "Language", save: "Save",
      restoreObs: "Restore OBS' original stream settings",
      noLive: "NOT LIVE", live: "LIVE", adjusting: "ADJUSTING", delayed: "DELAY", relayOff: "RELAY CLOSED", relayOffHint: "opens together with OBS",
      phases: { live: "live", delayed: "delayed", growing: "waiting for a keyframe", filling: "holding a frame, applying delay", shrinking: "cutting back to live" },
      toggleOff: "Turn delay off (back to live)", toggleOn: (s) => `Turn on ${s}s delay`,
      obsStreaming: "OBS streaming", scriptMissing: "OBS script is not running", obsReady: "OBS ready", obsNotConfigured: "OBS not configured",
      platformState: { idle: "Platform idle", connecting: "Platform connecting...", connected: "Platform connected", reconnecting: "Platform reconnecting..." },
      applying: "Applying in OBS...", confirmRestore: "Click again to confirm: OBS goes back to streaming directly, without the dynamic delay.",
      keySaved: "saved (type to replace)", keyPaste: "paste the key here", noScenes: "(open OBS to list the scenes)",
      developedBy: "Developed by",
      pickScene: "Pick the scene shown while the delay builds up.", saved: "Saved.", savedNext: "Saved. The new destination applies to the next stream.",
    },
    pt: {
      delayForViewers: "atraso para o público", configured: "configurado", obsNotUsing: "O OBS ainda não está transmitindo pelo delay dinâmico.",
      configureObs: "Configurar o OBS automaticamente", keyMissing: "Falta a chave de transmissão. Preencha em Configuração abaixo.",
      settings: "Configuração", platform: "Plataforma", other: "Outra", serverUrl: "URL do servidor (copie do painel da plataforma)",
      streamKey: "Chave de transmissão", growLabel: "Ao ligar ou aumentar o delay",
      growRewind: "Rebobinar (repete os últimos segundos, sem congelar)", growScene: "Mostrar uma cena do OBS enquanto o delay enche",
      growFreeze: "Congelar a imagem da live enquanto o delay enche", sceneLabel: "Cena mostrada enquanto o delay enche",
      sceneTip: "Dica: crie uma cena só com uma imagem ou texto, tipo \"Aplicando delay...\". Ela aparece parada e sem som.",
      startEnabled: "Começar toda live já com delay", language: "Idioma", save: "Salvar",
      restoreObs: "Restaurar a configuração original de transmissão do OBS",
      noLive: "SEM LIVE", live: "AO VIVO", adjusting: "AJUSTANDO", delayed: "DELAY", relayOff: "RELAY FECHADO", relayOffHint: "abre junto com o OBS",
      phases: { live: "ao vivo", delayed: "com delay", growing: "aguardando keyframe", filling: "congelado, aplicando delay", shrinking: "cortando para o vivo" },
      toggleOff: "Desligar delay (voltar ao vivo)", toggleOn: (s) => `Ligar delay de ${s}s`,
      obsStreaming: "OBS transmitindo", scriptMissing: "script do OBS não está rodando", obsReady: "OBS pronto", obsNotConfigured: "OBS não configurado",
      platformState: { idle: "Plataforma parada", connecting: "Plataforma conectando...", connected: "Plataforma conectada", reconnecting: "Plataforma reconectando..." },
      applying: "Aplicando no OBS...", confirmRestore: "Clique de novo para confirmar: o OBS volta a transmitir direto, sem o delay dinâmico.",
      keySaved: "salva (digite para trocar)", keyPaste: "cole a chave aqui", noScenes: "(abra o OBS para listar as cenas)",
      developedBy: "Desenvolvido por",
      pickScene: "Escolha a cena que aparece enquanto o delay enche.", saved: "Salvo.", savedNext: "Salvo. Destino novo vale na próxima live.",
    },
  };
  let lang = window.DD_LANG || (/^pt/i.test(navigator.language) ? "pt" : "en");
  const T = () => TEXT[lang] || TEXT.en;
  const num = (x) => (lang === "pt" ? x.toFixed(1).replace(".", ",") : x.toFixed(1));

  const $ = (id) => document.getElementById(id);
  const post = (path, body) =>
    fetch(API + path, {
      method: "POST",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then((r) => r.json());

  function applyLanguage(l) {
    lang = TEXT[l] ? l : "en";
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T()[el.dataset.t]));
    $("language").value = lang;
    if (cfg) $("key").placeholder = cfg.stream_key_set ? T().keySaved : T().keyPaste;
    fillScenes(cfg && cfg.delay_scene);
    if (lastStatus) render(lastStatus);
  }

  let cfg = null;
  let lastStatus = null;
  let lastMessage = null;
  let delaySeconds = 30;

  $("toggle").onclick = () => post("/api/toggle").then(refresh);
  document.querySelectorAll("[data-set]").forEach((b) => (b.onclick = () => post("/api/delay/" + b.dataset.set).then(refresh)));
  document.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => post("/api/add/" + b.dataset.add).then(refresh)));

  function obsAction(path) {
    post(path).then((r) => ($("msg").textContent = r.ok ? T().applying : r.error));
  }
  $("configureObs").onclick = () => obsAction("/api/obs/configure");
  // inside an OBS dock a plain link would navigate the dock itself: ask the relay to open the system browser
  $("author").onclick = (ev) => {
    ev.preventDefault();
    post("/api/open/author").catch(() => window.open($("author").href, "_blank"));
  };
  // two clicks instead of confirm(): dialogs may be blocked inside OBS docks
  let restoreArmed = 0;
  $("restoreObs").onclick = () => {
    if (Date.now() - restoreArmed < 5000) { restoreArmed = 0; obsAction("/api/obs/restore"); return; }
    restoreArmed = Date.now();
    $("saveMsg").textContent = T().confirmRestore;
  };

  function platformOf(url) {
    for (const [k, v] of Object.entries(URLS)) if (url === v) return k;
    return /kick|live-video\.net/.test(url) ? "kick" : "custom";
  }
  function showUrlRow() {
    const p = $("platform").value;
    $("urlRow").classList.toggle("hidden", p === "twitch" || p === "youtube");
  }
  $("platform").onchange = showUrlRow;

  let scenes = [];
  function fillScenes(selected) {
    const sel = $("scene");
    const names = [...new Set([...(selected ? [selected] : []), ...scenes])];
    const cur = sel.value || selected || "";
    sel.innerHTML = "";
    if (!names.length) {
      const o = document.createElement("option");
      o.value = ""; o.textContent = T().noScenes;
      sel.appendChild(o);
    }
    for (const n of names) {
      const o = document.createElement("option");
      o.value = o.textContent = n;
      sel.appendChild(o);
    }
    if (cur) sel.value = cur;
  }
  function showSceneRow() {
    $("sceneRow").classList.toggle("hidden", $("growMode").value !== "scene");
  }
  $("growMode").onchange = showSceneRow;
  $("language").onchange = () => {
    applyLanguage($("language").value);
    post("/api/config", Object.assign(currentForm(true), { language: lang }));
  };

  function loadConfig() {
    return fetch(API + "/api/config").then((r) => r.json()).then((c) => {
      cfg = c;
      $("platform").value = platformOf(c.upstream_url);
      $("url").value = URLS[$("platform").value] ? "" : c.upstream_url;
      $("key").value = "";
      $("startEnabled").checked = c.start_enabled;
      $("growMode").value = c.grow_mode || "rewind";
      $("scene").value = "";
      applyLanguage(c.language || lang);
      showSceneRow();
      showUrlRow();
      if (!c.stream_key_set) $("cfgBox").open = true;
    });
  }

  // saved=true: send what is stored now (used when only the language changes)
  function currentForm(saved) {
    if (saved && cfg) {
      return { upstream_url: cfg.upstream_url, start_enabled: cfg.start_enabled, delay_seconds: delaySeconds,
               grow_mode: cfg.grow_mode, delay_scene: cfg.delay_scene };
    }
    const p = $("platform").value;
    return {
      upstream_url: URLS[p] || $("url").value.trim(), start_enabled: $("startEnabled").checked, delay_seconds: delaySeconds,
      grow_mode: $("growMode").value, delay_scene: $("scene").value, language: lang,
    };
  }

  $("save").onclick = () => {
    const body = currentForm(false);
    if (body.grow_mode === "scene" && !body.delay_scene) {
      $("saveMsg").textContent = T().pickScene;
      return;
    }
    if ($("key").value.trim()) body.stream_key = $("key").value.trim();
    post("/api/config", body).then((r) => {
      $("saveMsg").textContent = !r.ok ? r.error : r.next_stream ? T().savedNext : T().saved;
      if (r.ok) loadConfig().then(refresh);
    });
  };

  function render(s) {
    lastStatus = s;
    const e = s.engine;
    delaySeconds = s.delay_seconds;
    const pill = $("pill");
    if (!e) {
      pill.className = "pill off"; pill.textContent = T().noLive; $("phase").textContent = "";
      $("current").textContent = num(0) + " s";
    } else {
      const busy = e.phase === "filling" || e.phase === "growing" || e.phase === "shrinking";
      pill.className = "pill " + (busy ? "busy" : e.phase === "live" ? "live" : "delayed");
      pill.textContent = e.phase === "live" ? T().live : busy ? T().adjusting : T().delayed;
      $("phase").textContent = T().phases[e.phase] || e.phase;
      $("current").textContent = num(e.current_ms / 1000) + " s";
    }
    $("delay").textContent = s.delay_seconds;
    const t = $("toggle");
    t.className = s.enabled ? "on" : "";
    t.textContent = s.enabled ? T().toggleOff : T().toggleOn(s.delay_seconds);

    const o = s.obs || {};
    if (o.scenes && o.scenes.join("\n") !== scenes.join("\n")) {
      scenes = o.scenes;
      fillScenes(cfg && cfg.delay_scene);
    }
    $("obsBox").classList.toggle("hidden", !(o.script && !o.configured));
    $("keyBox").classList.toggle("hidden", !cfg || cfg.stream_key_set);
    $("obs").className = "dot " + (o.script ? (o.configured ? "ok" : "warn") : "bad");
    $("obs").textContent = s.obs_connected ? T().obsStreaming : !o.script ? T().scriptMissing : o.configured ? T().obsReady : T().obsNotConfigured;
    const upCls = { connected: "ok", connecting: "warn", reconnecting: "bad", idle: "" }[s.upstream];
    $("up").className = "dot " + upCls;
    $("up").textContent = T().platformState[s.upstream];
    $("err").textContent = s.upstream !== "connected" && s.upstream_error ? s.upstream_error : "";
    if (o.message && o.message !== lastMessage) {
      lastMessage = o.message;
      $("msg").textContent = o.message;
      loadConfig(); // OBS may have imported a destination
    }
  }

  let offline = false;
  function refresh() {
    return fetch(API + "/api/status").then((r) => r.json()).then((s) => {
      if (offline || !cfg) { offline = false; loadConfig(); }
      render(s);
    }).catch(() => {
      offline = true;
      $("pill").className = "pill off"; $("pill").textContent = T().relayOff;
      $("phase").textContent = T().relayOffHint;
    });
  }
  applyLanguage(lang);
  refresh();
  setInterval(refresh, 700);
</script>
</body>
</html>
