name: Release

# Pushing a tag like v0.9.0 builds the Setup and publishes the GitHub release.
# Code signing turns on by itself once these repository secrets exist:
#   SIGN_PFX_BASE64  the .pfx certificate, base64 encoded
#   SIGN_PFX_PASS    its password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test
      - name: Certificate
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          "SIGN_PFX=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV
      - name: Build Setup
        shell: pwsh
        env:
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: ./scripts/build_setup.ps1
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "release-notes/$tag.md"
          $files = "dist/Dynamic-Delay-Setup.exe", "dist/Dynamic-Delay-StreamDeck.streamDeckPlugin", "dist/SHA256SUMS.txt"
          if (gh release view $tag 2>$null) { gh release upload $tag @files --clobber }
          elseif (Test-Path $notes) { gh release create $tag @files --title $tag --notes-file $notes }
          else { gh release create $tag @files --title $tag --generate-notes }
