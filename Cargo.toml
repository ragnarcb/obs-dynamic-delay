[package]
name = "obs-dynamic-delay"
version = "0.6.0"
edition = "2024"
description = "Dynamic stream delay for OBS: switch the delay on and off while live"
readme = "README.md"
publish = false
license-file = "LICENSE"
authors = ["ragnarcb"]
repository = "https://github.com/ragnarcb/obs-dynamic-delay"

[features]
# Portuguese (Brazil) as the default language (used for the Portuguese installer).
pt = []

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
env_logger = "0.11.11"
jiff = "0.2.37"
log = "0.4.34"
mp4 = "0.14.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rml_rtmp = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-native-tls = "0.3.1"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Foundation"] }
