[package]
name = "obs-dynamic-delay"
version = "0.2.0"
edition = "2024"
description = "Delay dinâmico para lives no OBS: liga e desliga o delay com a transmissão no ar"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
env_logger = "0.11.11"
log = "0.4.34"
rml_rtmp = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-native-tls = "0.3.1"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
